name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON files
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          find . -name '*.json' -not -path './node_modules/*' -print0 | xargs -0 -I{} sh -c 'echo "Validating {}"; jq empty "{}"'

      - name: Validate HTML
        run: npx --yes htmlhint index.html
